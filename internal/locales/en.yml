help_owner: |
  👑 <b>𝑶𝒘𝒏𝒆𝒓 𝑪𝒐𝒎𝒎𝒂𝒏𝒅𝒔</b>

  𝑬𝒙𝒄𝒍𝒖𝒔𝒊𝒗𝒆 𝑻𝒐𝒐𝒍𝒔 𝑭𝒐𝒓 𝑴𝒂𝒏𝒂𝒈𝒊𝒏𝒈 𝑺𝒖𝒅𝒐𝒆𝒓𝒔, 𝑬𝒙𝒆𝒄𝒖𝒕𝒊𝒏𝒈 𝑺𝒚𝒔𝒕𝒆𝒎 𝑪𝒐𝒅𝒆, 𝑨𝒏𝒅 𝑷𝒆𝒓𝒇𝒐𝒓𝒎𝒊𝒏𝒈 𝑩𝒐𝒕 𝑨𝒅𝒎𝒊𝒏𝒊𝒔𝒕𝒓𝒂𝒕𝒊𝒐𝒏 𝑺𝒆𝒄𝒖𝒓𝒆𝒍𝒚.

  <b>𝑪𝒐𝒎𝒎𝒂𝒏𝒅𝒔:</b>
  <b>/addsudo</b> — 𝑨𝒅𝒅 𝑨 𝑵𝒆𝒘 𝑼𝒔𝒆𝒓 𝑻𝒐 𝑻𝒉𝒆 𝑩𝒐𝒕'𝒔 𝑺𝒖𝒅𝒐 𝑳𝒊𝒔𝒕
  <b>/delsudo</b> — 𝑹𝒆𝒎𝒐𝒗𝒆 𝑨 𝑼𝒔𝒆𝒓 𝑭𝒓𝒐𝒎 𝑻𝒉𝒆 𝑩𝒐𝒕'𝒔 𝑺𝒖𝒅𝒐 𝑳𝒊𝒔𝒕
  <b>/eval</b> — 𝑬𝒙𝒆𝒄𝒖𝒕𝒆 𝑮𝒐 𝑪𝒐𝒅𝒆 𝑺𝒏𝒊𝒑𝒑𝒆𝒕𝒔
  <b>/maintenance</b> — 𝑴𝒂𝒏𝒂𝒈𝒆 𝑻𝒉𝒆 𝑩𝒐𝒕'𝒔 𝑴𝒂𝒊𝒏𝒕𝒆𝒏𝒂𝒏𝒄𝒆 𝑴𝒐𝒅𝒆
  <b>/restart</b> — 𝑹𝒆𝒔𝒕𝒂𝒓𝒕 𝑻𝒉𝒆 𝑩𝒐𝒕
  <b>/sh</b> — 𝑹𝒖𝒏 𝑺𝒉𝒆𝒍𝒍 𝑪𝒐𝒎𝒎𝒂𝒏𝒅𝒔

help_sudo: |
  ⚡ <b>𝑺𝒖𝒅𝒐𝒆𝒓 𝑪𝒐𝒎𝒎𝒂𝒏𝒅𝒔</b>

  𝑨𝒅𝒗𝒂𝒏𝒄𝒆𝒅 𝑻𝒐𝒐𝒍𝒔 𝑭𝒐𝒓 𝑴𝒂𝒏𝒂𝒈𝒊𝒏𝒈 𝑩𝒐𝒕 𝑩𝒆𝒉𝒂𝒗𝒊𝒐𝒓, 𝑴𝒐𝒏𝒊𝒕𝒐𝒓𝒊𝒏𝒈 𝑷𝒆𝒓𝒇𝒐𝒓𝒎𝒂𝒏𝒄𝒆, 𝑨𝒏𝒅 𝑪𝒐𝒏𝒕𝒓𝒐𝒍𝒍𝒊𝒏𝒈 𝑳𝒐𝒈𝒈𝒊𝒏𝒈 𝑨𝒏𝒅 𝑨𝒖𝒕𝒐𝒎𝒂𝒕𝒊𝒐𝒏.

  <b>𝑪𝒐𝒎𝒎𝒂𝒏𝒅𝒔:</b>
  <b>/active</b> — 𝑺𝒉𝒐𝒘𝒔 𝑻𝒐𝒕𝒂𝒍 𝑨𝒄𝒕𝒊𝒗𝒆 𝑪𝒉𝒂𝒕𝒔
  <b>/autoleave</b> — 𝑻𝒐𝒈𝒈𝒍𝒆 𝑨𝒖𝒕𝒐𝒎𝒂𝒕𝒊𝒄 𝑪𝒉𝒂𝒕 𝑳𝒆𝒂𝒗𝒊𝒏𝒈
  <b>/logger</b> — 𝑬𝒏𝒂𝒃𝒍𝒆 𝑶𝒓 𝑫𝒊𝒔𝒂𝒃𝒍𝒆 𝑳𝒐𝒈𝒈𝒆𝒓
  <b>/stats</b> — 𝑫𝒊𝒔𝒑𝒍𝒂𝒚 𝑻𝒉𝒆 𝑩𝒐𝒕 & 𝑺𝒚𝒔𝒕𝒆𝒎 𝑺𝒕𝒂𝒕𝒔
  <b>/logs</b> — 𝑮𝒆𝒕 𝑻𝒉𝒆 𝑺𝒚𝒔𝒕𝒆𝒎 𝑳𝒐𝒈𝒔
  <b>/block</b> / <b>/unblock</b> — 𝑴𝒂𝒏𝒂𝒈𝒆 𝑻𝒉𝒆 𝑮𝒍𝒐𝒃𝒂𝒍 𝑼𝒔𝒆𝒓 𝑩𝒍𝒐𝒄𝒌 𝑳𝒊𝒔𝒕
  <b>/blocked</b> — 𝑺𝒉𝒐𝒘 𝑩𝒍𝒐𝒄𝒌𝒆𝒅 𝑼𝒔𝒆𝒓𝒔
